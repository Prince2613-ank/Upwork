<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Flodata</title><link rel="stylesheet" href="/dashboard.css"><script src="/login.js" defer></script></head>
<body class="login-page">
<section class="login-card">
  <h1>Sign in</h1>
  <form id="login-form">
    <label>Username<input name="username" autocomplete="username" maxlength="128" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" maxlength="512" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p id="login-error" class="error" role="alert" aria-live="polite"></p>
</section>
</body></html>
