name: Server pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: flodata
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: flodata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flodata -d flodata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.lock
      - run: pip install -r requirements-server.lock
      - run: python -m pytest tests/test_server_pipeline.py tests/test_production_flow.py tests/test_deployment_transfer.py tests/test_auto_release.py tests/test_files_cleanup.py tests/test_worker_speed.py tests/test_daily_context.py -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://flodata:test-only-password@localhost:5432/flodata_test
      - run: python -m compileall -q server
      - run: cp .env.server.example .env.server && docker compose --env-file .env.server -f compose.server.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
